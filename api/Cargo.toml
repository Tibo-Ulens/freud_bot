[package]
name = "freudbot_api"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = "thin"
codegen-units = 8

[dependencies]
anyhow = "1.0.98"
axum = { version="0.8.4", features=["macros"] }
axum-extra = { version="0.10.1", features=["cookie", "cookie-private"] }
base64 = "0.22.1"
chrono = { version="0.4.41", features=["serde"] }
console-subscriber = "0.4.1"
deadpool-redis = "0.20.0"
diesel = { version="2.2.10", features=["chrono", "uuid"] }
diesel-async = { version="0.5.2", features=["postgres", "deadpool", "async-connection-wrapper"] }
http = "1.3.1"
lettre = "0.11.15"
oauth2 = "5.0.0"
reqwest = { version="0.12.15", features=["json"] }
serde = { version="1.0.219", features=["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = "0.3.41"
tokio = { version="1.44.2", features=["full", "tracing"] }
tower = "0.5.2"
tower-http = { version="0.6.2", features=["trace", "compression-full", "timeout"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = { version="1.16.0", features=["serde", "v4", "v7"] }
